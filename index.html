  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    body{margin:0;background:#E8E6DF;color:#333E48;font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;}\n    a{color:#0074C8;text-decoration:none;} a:hover{color:#33637E;text-decoration:underline;}\n    * { box-sizing: border-box; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"max-width:1180px;margin:0 auto;padding:40px 24px 64px;display:flex;flex-direction:column;gap:20px;\">\n\n  <header style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid #333E48;padding-bottom:16px;\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;\">\n      <div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#5B6670;\">Sanlam Private Wealth · Market Data<\u002Fdiv>\n      <h1 style=\"margin:0;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:0.01em;\">Index Returns<\u002Fh1>\n      <div style=\"font-size:14px;color:#5B6670;\">As at 30 September 2026 · Total returns, local currency unless stated<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;\">\n    <div style=\"display:flex;flex-direction:column;gap:6px;\">\n      <div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#5B6670;\">Your portfolio manager<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ openProfile }}\" style=\"display:flex;align-items:center;gap:10px;height:37px;padding:0 12px 0 3px;border:1px solid #333E48;border-radius:2px;background:#fff;color:#333E48;cursor:pointer;text-align:left;\" style-hover=\"background:#F6F5F2;\">\n        <span style=\"position:relative;width:30px;height:30px;border-radius:50%;overflow:hidden;flex:none;\"><img src=\"24689e99-c4b4-4052-abd8-c72a0f4344e5\" alt=\"\" style=\"position:absolute;width:123px;height:auto;left:-45px;top:-3px;max-width:none;\"><\u002Fspan>\n        <span style=\"font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;line-height:1;\">Guy Allan<\u002Fspan>\n        <span style=\"width:1px;align-self:stretch;margin:7px 0;background:#D8D6CF;\"><\u002Fspan>\n        <span style=\"font-size:12px;font-weight:700;color:#0074C8;display:flex;align-items:center;gap:4px;\">Profile <span style=\"font-size:14px;line-height:1;\">›<\u002Fspan><\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:6px;align-items:flex-end;\">\n      <div style=\"font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#5B6670;\">Period<\u002Fdiv>\n      <div style=\"display:flex;border:1px solid #333E48;border-radius:2px;overflow:hidden;\">\n        <sc-for list=\"{{ periodBtns }}\" as=\"b\" hint-placeholder-count=\"7\">\n          <button sc-camel-on-click=\"{{ b.select }}\" style=\"border:0;border-left:1px solid #333E48;padding:8px 14px;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;background:{{ b.bg }};color:{{ b.fg }};min-width:56px;\">{{ b.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ showProfile }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeProfile }}\" style=\"position:fixed;inset:0;z-index:100;background:rgba(51,62,72,0.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;\">\n      <div sc-camel-on-click=\"{{ stop }}\" role=\"dialog\" aria-label=\"Guy Allan profile\" style=\"background:#fff;max-width:980px;width:100%;border-radius:2px;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,0.25);\">\n        <div style=\"background:#333E48;color:#fff;padding:20px 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start;\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n            <div style=\"font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:38px;line-height:0.95;text-transform:uppercase;\">Guy Allan, CFA, CAIA<\u002Fdiv>\n            <div style=\"font-size:13px;letter-spacing:0.06em;text-transform:uppercase;color:#B9D2DB;\">Senior Portfolio Manager · Private Clients<\u002Fdiv>\n            <p style=\"margin:8px 0 0;font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:20px;line-height:1.2;max-width:520px;text-wrap:pretty;\">“The way to get started is to quit talking and begin doing.” <span style=\"font-family:Arial,sans-serif;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#B9D2DB;\">Walt Disney<\u002Fspan><\u002Fp>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeProfile }}\" aria-label=\"Close\" style=\"width:44px;height:44px;border:1px solid rgba(255,255,255,0.5);border-radius:2px;background:transparent;color:#fff;font-size:22px;line-height:1;cursor:pointer;\">×<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px;padding:24px 28px 28px;\">\n          <div style=\"display:flex;flex-direction:column;gap:14px;\">\n            <div style=\"background:#fff;display:flex;justify-content:center;\"><img src=\"24689e99-c4b4-4052-abd8-c72a0f4344e5\" alt=\"Guy Allan\" style=\"width:100%;max-width:240px;height:auto;display:block;\"><\u002Fdiv>\n            <div style=\"background:#E8E6DF;padding:16px;display:flex;flex-direction:column;gap:10px;\">\n              <div style=\"font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:14px;letter-spacing:0.14em;text-transform:uppercase;color:#0074C8;\">Personal<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px;\"><span style=\"font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#5B6670;\">Family<\u002Fspan><p style=\"margin:0;font-size:14px;line-height:1.4;text-wrap:pretty;\">Married to Kate, with two sons, Josh and Matt — his source of inspiration and motivation.<\u002Fp><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px;\"><span style=\"font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#5B6670;\">Interests<\u002Fspan><p style=\"margin:0;font-size:14px;line-height:1.4;text-wrap:pretty;\">Reading, travelling, sport and adventure biking, as well as padel, with close to 300 games played.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;\">\n            <div style=\"font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:17px;letter-spacing:0.14em;text-transform:uppercase;border-bottom:2px solid #333E48;padding-bottom:3px;\">Qualifications<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px;padding-bottom:9px;border-bottom:1px solid #D8D6CF;\">\n              <div style=\"font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:18px;line-height:1.1;text-transform:uppercase;color:#0074C8;\">Chartered Financial Analyst <span style=\"font-size:13px;color:#8B939B;\">CFA · 2006<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.4;color:#5B6670;text-wrap:pretty;\">Widely regarded as the hardest qualification in investment management. Three exams over roughly four years, about 1 000 hours of study alongside a full-time job, and average pass rates of 41–52% per level — most who start never finish. Then 4 000 hours of verified investment work before the letters may be used.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px;padding-bottom:9px;border-bottom:1px solid #D8D6CF;\">\n              <div style=\"font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:18px;line-height:1.1;text-transform:uppercase;color:#0074C8;\">Chartered Alternative Investment Analyst <span style=\"font-size:13px;color:#8B939B;\">CAIA · 2009<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.4;color:#5B6670;text-wrap:pretty;\">The specialist qualification for the parts of the market hardest to see into: private equity, hedge funds, private credit and real assets. Only around 14 000 people worldwide hold it — it is how Guy prices what you are offered, and knows when the answer is no.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px;padding-bottom:9px;border-bottom:1px solid #D8D6CF;\">\n              <div style=\"font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:18px;line-height:1.1;text-transform:uppercase;\">Postgraduate Management Diploma <span style=\"font-size:13px;color:#8B939B;\">GIBS · 2014<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.4;color:#5B6670;text-wrap:pretty;\">A postgraduate qualification from one of Africa's leading business schools — leadership and strategy: running a business and its people, not just a portfolio.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:3px;\">\n              <div style=\"font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:18px;line-height:1.1;text-transform:uppercase;\">BCom Finance <span style=\"font-size:13px;color:#8B939B;\">2003<\u002Fspan><\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:1.4;color:#5B6670;text-wrap:pretty;\">The foundation: markets, accounting and corporate finance.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px;\">\n            <div style=\"display:flex;align-items:baseline;gap:12px;border-bottom:2px solid #333E48;padding-bottom:3px;\"><span style=\"font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:44px;line-height:1;color:#0074C8;\">28<\u002Fspan><span style=\"font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-size:17px;letter-spacing:0.14em;text-transform:uppercase;\">Years in markets<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:10px;border-left:1px solid #D8D6CF;padding-left:14px;\">\n              <div style=\"display:flex;flex-direction:column;gap:2px;\"><div style=\"font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:16px;text-transform:uppercase;\">Sanlam Private Wealth <span style=\"font-size:13px;color:#8B939B;\">· since Jan 2015<\u002Fspan><\u002Fdiv><p style=\"margin:0;font-size:14px;line-height:1.4;color:#5B6670;text-wrap:pretty;\">Senior Portfolio Manager. Sets investment strategy and carries direct responsibility for ultra-high-net-worth client portfolios.<\u002Fp><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px;\"><div style=\"font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:16px;text-transform:uppercase;\">BoE Private Clients <span style=\"font-size:13px;color:#8B939B;\">· acquired by Nedbank<\u002Fspan><\u002Fdiv><p style=\"margin:0;font-size:14px;line-height:1.4;color:#5B6670;text-wrap:pretty;\">Portfolio Manager — built and grew discretionary portfolios for private clients and family trusts.<\u002Fp><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:2px;\"><div style=\"font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;font-weight:600;font-size:16px;text-transform:up ribution to SA returns in US$'],\n  ];\n  longRows = [\n    ['All Share',[16.1,18.7,15.4,11.6]],['Resources',[45.4,30.0,19.8,18.8]],['Financials',[16.0,21.7,16.9,9.7]],\n    ['Industrials',[1.2,8.6,9.6,7.4]],['Listed Property',[15.7,26.5,15.9,4.7]],['Preference Shares',[13.9,16.2,16.5,12.2]],\n    ['All Bond',[13.7,17.7,12.1,10.3]],['Cash',[7.4,7.8,7.1,6.8]],\n  ];\n  cpi = [3.8,3.8,4.8,4.6];\n  yieldData = [['South Africa',9.00,[27,58,-30,-16,81]],['USA',5.28,[53,82,97,113,112]],['UK',5.42,[36,67,51,73,95]],['Eurozone',3.59,[26,73,58,88,73]],['Japan',3.07,[11,38,71,142,100]]];\n\n  fmt(v, d = 1) { return v == null ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d) + '%'; }\n  col(v) { return v == null ? '#8B939B' : v < 0 ? this.BRONZE : this.BLUE; }\n  bars(rows, p, base = 0) {\n    const M = Math.max(1, ...rows.map(r => Math.abs(r.v[p] - base)));\n    return rows.map(r => { const v = +(r.v[p] - base).toFixed(2); return { ...r, val: v, txt: this.fmt(v), color: this.col(v), negW: v < 0 ? Math.abs(v) / M * 100 : 0, posW: v > 0 ? v / M * 100 : 0 }; });\n  }\n\n  renderVals() {\n    const p = this.props.defaultPeriod != null && this.state.p === -1 ? this.PS.indexOf(this.props.defaultPeriod) : this.state.p;\n    const sort = this.props.sortByReturn ?? true;\n    const expandAll = this.props.expandAll ?? false;\n\n    const periodBtns = this.PS.map((label, i) => ({ label, select: () => this.setState({ p: i }), bg: i === p ? this.NAVY : '#fff', fg: i === p ? '#fff' : this.NAVY }));\n\n    const rel = this.state.rel, base = rel ? this.allShare[p] : 0;\n    const modeBtns = [['Absolute', false], ['vs All Share', true]].map(([label, r]) => ({ label, select: () => this.setState({ rel: r }), bg: r === rel ? this.NAVY : '#fff', fg: r === rel ? '#fff' : this.NAVY }));\n    const sectorNote = rel ? `Relative to All Share (${this.fmt(this.allShare[p])}) · ${this.P[p]} · click a group for sub-sectors` : `Total return · ${this.P[p]} · click a group for sub-sectors`;\n    let sectors = this.bars(this.groups, p, base);\n    if (sort) sectors = sectors.slice().sort((a, b) => b.val - a.val);\n    sectors = sectors.map(g => {\n      const isOpen = g.subs.length > 0 && (expandAll || !!this.state.open[g.name]);\n      const subs = g.subs.length ? this.bars(g.subs.map(s => ({ name: s[0], v: s[1] })), p, base).sort((a, b) => b.val - a.val) : [];\n      return { ...g, isOpen, subs, mark: g.subs.length ? (isOpen ? '–' : '+') : '', toggle: () => this.setState(s => ({ open: { ...s.open, [g.name]: !s.open[g.name] } })) };\n    });\n\n    const tv = this.tileData.filter(t => t[1][p] != null).map(t => ({ name: t[0], v: t[1][p], note: t[2] })).sort((a, b) => b.v - a.v);\n    const tMax = Math.max(0, ...tv.map(t => t.v)), tMin = Math.min(0, ...tv.map(t => t.v)), tSpan = (tMax - tMin) || 1;\n    const PLOT = 200, LABEL = 30, k = PLOT / tSpan;\n    const topPx = Math.round(tMax * k) + LABEL, botPx = Math.round(-tMin * k);\n    const tiles = tv.map(t => ({ name: t.name, note: t.note, txt: this.fmt(t.v), color: this.col(t.v), topPx, botPx, posPx: t.v > 0 ? Math.round(t.v * k) : 0, negPx: t.v < 0 ? Math.round(-t.v * k) : 0 }));\n\n    const all = this.intlData.flatMap(r => [r[1][p], r[2][p]]);\n    const lo = Math.min(0, ...all) - 2, hi = Math.max(0, ...all) + 2, X = v => (v - lo) / (hi - lo) * 100;\n    const intl = this.intlData.map(r => { const u = r[1][p], z = r[2][p]; return { name: r[0], usdTxt: this.fmt(u), zarTxt: this.fmt(z), color: this.col(z), zeroX: X(0), usdX: X(u), zarX: X(z), lineL: Math.min(X(u), X(z)), lineW: Math.abs(X(u) - X(z)) }; });\n    const fxDiff = this.intlData.reduce((a, r) => a + (r[2][p] - r[1][p]), 0) / this.intlData.length;\n    const fxNote = 'Rand ' + (fxDiff < 0 ? 'strength' : 'weakness') + ' ' + (fxDiff < 0 ? 'cost' : 'added') + ' the average offshore index ' + Math.abs(fxDiff).toFixed(1) + ' pts over ' + this.P[p].toLowerCase() + '.';\n\n    const commodities = this.bars(this.commData.map(c => ({ name: c[0], v: c[1] })), p).sort((a, b) => b.val - a.val);\n\n    const realRows = this.longRows.map(r => ({ name: r[0], cells: r[1].map((n, i) => { const real = n - this.cpi[i]; const a = Math.min(0.9, Math.abs(real) / 18); const strong = a > 0.55; return { realTxt: this.fmt(real), nomTxt: n.toFixed(1) + '%', bg: real >= 0 ? `rgba(0,116,200,${a})` : `rgba(188,149,91,${a})`, fg: strong ? '#fff' : this.NAVY, subFg: strong ? 'rgba(255,255,255,0.8)' : '#5B6670' }; }) }));\n    const cpiCells = this.cpi.map(c => c.toFixed(1) + '%');\n\n    const bp = [0, 1, 2, 4, 3, null, null][p];\n    const yields = this.yieldData.map(y => { const d = bp == null ? null : y[2][bp]; return { name: y[0], level: y[1].toFixed(2) + '%', txt: d == null ? 'Not reported' : (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(d) + ' bp', color: d == null ? '#8B939B' : d > 0 ? this.BRONZE : d < 0 ? this.BLUE : '#5B6670' }; });\n\n    const ranked = this.bars(this.groups, p).slice().sort((a, b) => b.val - a.val);\n    const best = ranked[0], worst = ranked[ranked.length - 1], alsi = this.allShare[p];\n    const bondV = this.tileData[2][1][p], cashV = this.tileData[3][1][p];\n    const insights = [\n      { k: 'Leader & laggard', v: `${best.name} led at ${this.fmt(best.val)} while ${worst.name} lagged at ${this.fmt(worst.val)} — a ${(best.val - worst.val).toFixed(1)} pt spread against an All Share return of ${this.fmt(alsi)}.` },\n      { k: 'Equity vs bonds', v: alsi > bondV ? `SA equities outpaced the All Bond Index by ${(alsi - bondV).toFixed(1)} pts; cash returned ${this.fmt(cashV)}.` : `The All Bond Index (${this.fmt(bondV)}) beat SA equities (${this.fmt(alsi)}); cash returned ${this.fmt(cashV)}.` },\n      { k: 'Offshore in rand terms', v: fxNote },\n    ];\n\n    // Derived analysis\n    const consistency = this.groups.map(g => {\n      const cells = g.v.map((v, i) => { const d = v - this.allShare[i]; const beat = d > 0; return { txt: (beat ? '+' : '−') + Math.abs(d).toFixed(0), title: `${this.PS[i]}: ${this.fmt(d)} vs All Share`, bg: beat ? '#0074C8' : '#BC955B', fg: '#fff' }; });\n      const n = cells.filter(c => c.bg === '#0074C8').length;\n      return { name: g.name, cells, n, score: `${n}/7`, color: n >= 5 ? this.BLUE : n <= 2 ? this.BRONZE : this.NAVY };\n    }).sort((a, b) => b.n - a.n);\n    const cTop = consistency.filter(c => c.n === consistency[0].n).map(c => c.name), cBot = consistency[consistency.length - 1];\n    const hc = this.groups.find(g => g.name === 'Health Care');\n    const consistencyNote = `${cTop.join(' and ')} beat the index on ${consistency[0].n} of 7 horizons. ${cBot.name} beat it on ${cBot.n}${cBot.n === 0 ? ' — lagging on every horizon' : ''}.` + (hc.v[6] < this.allShare[6] && hc.v[4] > this.allShare[4] ? ` Health Care's strong 12 months (${this.fmt(hc.v[4])}) masks a 5-year record of ${this.fmt(hc.v[6])} p.a. vs ${this.fmt(this.allShare[6])} for the market.` : '');\n\n    const momentum = this.bars(this.groups.map(g => ({ name: g.name, v: [g.v[4] - g.v[6]], r12: this.fmt(g.v[4]), r5: this.fmt(g.v[6]) })), 0).sort((a, b) => b.val - a.val);\n    const momentumNote = `${momentum[0].name} is running ${momentum[0].val.toFixed(0)} pts above its 5-year pace; ${momentum[momentum.length - 1].name} is ${Math.abs(momentum[momentum.length - 1].val).toFixed(0)} pts below. Large positive gaps historically mean-revert; treat them as a prompt to check position sizes, not a forecast.`;\n\n    const W = this.intlData[0];\n    const fxRaw = W[1].map((u, i) => ({ label: this.PS[i], u, z: W[2][i], fx: +(W[2][i] - u).toFixed(1) }));\n    const fxAll = fxRaw.flatMap(r => [r.u, r.z, 0]);\n    const fLo = Math.min(...fxAll) - 1, fHi = Math.max(...fxAll) + 1, FX = v => (v - fLo) / (fHi - fLo) * 100;\n    const fxDecomp = fxRaw.map(r => { const a = Math.min(0, r.u), b = Math.max(0, r.u); const fa = Math.min(r.u, r.z), fb = Math.max(r.u, r.z); return { label: r.label, zarTxt: this.fmt(r.z), fxTxt: this.fmt(r.fx), zeroX: FX(0), mktL: FX(a), mktW: FX(b) - FX(a), fxL: FX(fa), fxW: FX(fb) - FX(fa) }; });\n    const fxHurt = fxRaw.filter(r => r.fx < 0).length;\n    const fxWorst = fxRaw.reduce((a, b) => b.fx < a.fx ? b : a);\n    const fxDecompNote = `Rand strength subtracted from offshore returns on ${fxHurt} of 7 horizons — most sharply over ${this.P[this.PS.indexOf(fxWorst.label)].toLowerCase()} (${this.fmt(fxWorst.fx)}), where a ${this.fmt(fxWorst.u)} US$ gain became ${this.fmt(fxWorst.z)} in rand. Over 5 years the currency ${fxRaw[6].fx >= 0 ? 'still adds' : 'costs'} ${this.fmt(fxRaw[6].fx)} p.a.`;\n\n    const disp = this.PS.map((label, i) => { const vs = this.groups.map(g => g.v[i]); return { label, d: Math.max(...vs) - Math.min(...vs) }; });\n    const dMax = Math.max(...disp.map(d => d.d));\n    const dispersion = disp.map(d => ({ label: d.label, txt: d.d.toFixed(0) + ' pts', h: d.d / dMax * 100, bg: d.d === dMax ? this.BLUE : '#7996AB' }));\n    const dTop = disp.reduce((a, b) => b.d > a.d ? b : a);\n    const dI = this.PS.indexOf(dTop.label), dVs = this.groups.map(g => ({ n: g.name, v: g.v[dI] })).sort((a, b) => b.v - a.v);\n    const dispersionNote = `Widest over ${this.P[dI].toLowerCase()} at ${dTop.d.toFixed(0)} pts (${dVs[0].n} vs ${dVs[dVs.length - 1].n}). Even in a single month sector choice moved outcomes by ${disp[0].d.toFixed(0)} pts — index-level returns hide most of the story.`;\n\n    const cpi10 = this.cpi[3];\n    const lg = this.longRows.map(r => ({ name: r[0], real: ((1 + r[1][3] / 100) / (1 + cpi10 / 100) - 1) * 100 })).sort((a, b) => b.real - a.real);\n    const lMax = Math.max(...lg.map(l => Math.abs(l.real)));\n    const league = lg.map((l, i) => ({ rank: i + 1, name: l.name, txt: this.fmt(l.real), w: Math.abs(l.real) / lMax * 100, bg: l.real >= 0 ? this.BLUE : this.BRONZE, color: l.real >= 0 ? this.NAVY : this.BRONZE }));\n    const leagueNote = `Over a full decade ${lg[0].name} led at ${this.fmt(lg[0].real)} real. Cash at ${this.fmt(lg.find(l => l.name === 'Cash').real)} and Listed Property at ${this.fmt(lg.find(l => l.name === 'Listed Property').real)} barely preserved purchasing power — the gap to bonds (${this.fmt(lg.find(l => l.name === 'All Bond').real)}) is the cost of staying defensive.`;\n\n    return { showProfile: !!this.state.showProfile, openProfile: () => this.setState({ showProfile: true }), closeProfile: () => this.setState({ showProfile: false }), stop: e => e.stopPropagation(), consistency, consistencyNote, momentum, momentumNote, fxDecomp, fxDecompNote, dispersion, dispersionNote, league, leagueNote, periodBtns, modeBtns, sectorNote, periodLabel: this.P[p], sectors, tiles, intl, fxNote, commodities, horizons: ['2 years', '3 years', '5 years', '10 years'], realRows, cpiCells, yields, bondPeriodLabel: bp == null ? 'not reported beyond 12 months' : this.P[p], insights };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
